[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgrad-amlworld"
version = "1.0.0"
description = "Drift-invariant cycle features for account-level money-laundering detection on AMLworld (code and results)"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "torch==2.15.0",
    "torch-geometric==2.8.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]
